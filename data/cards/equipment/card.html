<div class="card equipment-card">
  <h3 class="card-title">🎒 Equipment</h3>
  <table id="equipment" data-dynamic-table data-table-max="10">
    <thead>
      <tr>
        <th data-field="name">Name</th>
        <th data-field="details">Details</th>
        <th data-field="uses">Uses</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button type="button" data-table-add="equipment">+ Add Row</button>
  <button type="button" id="starting-equipment-btn">Starting Equipment</button>
</div>
