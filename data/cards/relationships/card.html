<div class="card relationships-card">
  <h3 class="card-title">🤝 Relationships</h3>
  <table id="relationships" data-dynamic-table data-table-max="10">
    <thead>
      <tr>
        <th data-field="name">PC's Name</th>
        <th data-field="relationship">Relationship</th>
        <th data-field="depth" data-type="number" data-min="0" data-max="3">Depth (0-3)</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <button type="button" data-table-add="relationships">+ Add Row</button>
</div>
