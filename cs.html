<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Sheet</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Force Class / Paths / Copy-Clear onto their own line, always - regardless of
     how much horizontal room .role-controls (flex, wraps) actually has. */
  .role-controls {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }

  .role-primary,
  .role-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .paths-fieldset {
    border: 1px solid #dee2e6;
    border-radius: 6px;
    padding: 6px 10px 8px;
    margin: 0;
  }

  .paths-fieldset legend {
    padding: 0 6px;
    font-size: 14px;
    font-weight: 600;
    color: #555;
  }

  .paths-flow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
  }

  .path-field {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* .all-stats vertically centers its items by default, but the Level/HP/
     Armor labels stack a caption above their control while the help icon
     has no caption - so centering lines the button up with the middle of
     the whole caption+control stack, not with the controls themselves,
     making it look too high. Bottom-align instead so the button sits level
     with the XP track and the input boxes. */
  .all-stats {
    align-items: flex-end;
  }

  /* Nudge up slightly from the exact bottom edge - flush bottom-alignment
     sits a touch low against the input boxes. */
  #level1-help-button {
    margin-bottom: 3px;
  }

</style>

</head>
<body>
  <!-- Loading indicator -->
  <div id="loading-indicator" class="loading-indicator">
    <div class="loading-spinner"></div>
    <span>Loading...</span>
  </div>

  <!-- Attribution banner -->
  <div id="attribution-banner" style="font-size: 12px; color: #666; text-align: center; padding: 6px 10px; margin-bottom: 10px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px;">
    Content by Spencer Moore and Helena Real &bull; <a href="https://www.dungeon-world.com/beta/" target="_blank" style="color: #007bff;">Dungeon World 2 Beta</a> &bull; <a href="https://github.com/tznind/dw2"><img width="12" height="12" alt="GitHub logo" src="https://github.com/user-attachments/assets/d45893e9-0b26-4259-8764-a9737ee1426e" style="margin-right: 3px; background: #000; border-radius: 50%; padding: 1px;" /> Source Code</a>
  </div>

  <!-- Module attribution banner (shown when modules with attribution data are enabled) -->
  <div id="module-attributions" style="display: none; font-size: 12px; color: #666; text-align: center; padding: 6px 10px; margin-bottom: 10px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px;"></div>

  <!-- Validation warning indicator (upper right, subtle) -->
  <button type="button" id="validation-warning" class="validation-warning" style="display: none;" title="Click to view validation errors">
    <span class="warning-icon">⚠️</span>
    <span class="warning-count">0</span>
  </button>

  <form>
    <!-- Character Info Box -->
    <div class="character-info-box">
      <div class="basic-info">
        <div class="form-field">
          <label for="name">Name (& pronouns):</label>
          <input type="text" id="name" name="name">
        </div>
        
        <div class="form-field">
          <label for="player">Player:</label>
          <input type="text" id="player" name="player">
        </div>
      </div>
      
      <!-- Role selectors support data-roles attribute to limit which roles appear:
           - Comma-separated list: data-roles="The Bard,Wanderer"
           - Wildcard for all roles: data-roles="*"
           - No attribute: shows all roles (same as *) -->
      <div class="role-controls">
        <div class="role-primary">
          <label for="role">Class:</label>
          <select id="role" name="role" data-roles="The Bard,The Cleric,The Fighter,The Rogue,The Wizard">
            <option value="">Select class...</option>
          </select>
          <button type="button" id="role-help-button" class="help-icon" title="Show class description">?</button>
        </div>

        <fieldset class="paths-fieldset">
          <legend>Paths</legend>
          <div class="paths-flow">
            <div class="path-field">
              <label for="role2">Path 1:</label>
              <select id="role2" name="role2" data-roles="Dabbler, Diplomat, Swashbuckler, Healer, Oracle, Warpriest, Brawler, Spellblade, Tactician, Assassin, Burglar, Spy, Evoker, Illusionist, Necromancer">
                <option value="">Select path...</option>
              </select>
              <button type="button" id="role2-help-button" class="help-icon" title="Show path 1 description">?</button>
            </div>

            <div class="path-field">
              <label for="role3">Path 2:</label>
              <select id="role3" name="role3" data-roles="Dabbler, Diplomat, Swashbuckler, Healer, Oracle, Warpriest, Brawler, Spellblade, Tactician, Assassin, Burglar, Spy, Evoker, Illusionist, Necromancer">
                <option value="">Select path...</option>
              </select>
              <button type="button" id="role3-help-button" class="help-icon" title="Show path 2 description">?</button>
            </div>

            <div class="path-field">
              <label for="role4">Multiclass 1:</label>
              <select id="role4" name="role4" data-roles="Dabbler, Diplomat, Swashbuckler, Healer, Oracle, Warpriest, Brawler, Spellblade, Tactician, Assassin, Burglar, Spy, Evoker, Illusionist, Necromancer">
                <option value="">Select path...</option>
              </select>
              <button type="button" id="role4-help-button" class="help-icon" title="Show multiclass 1 description">?</button>
            </div>

            <div class="path-field">
              <label for="role5">Multiclass 2:</label>
              <select id="role5" name="role5" data-roles="Dabbler, Diplomat, Swashbuckler, Healer, Oracle, Warpriest, Brawler, Spellblade, Tactician, Assassin, Burglar, Spy, Evoker, Illusionist, Necromancer">
                <option value="">Select path...</option>
              </select>
              <button type="button" id="role5-help-button" class="help-icon" title="Show multiclass 2 description">?</button>
            </div>
          </div>
        </fieldset>

        <div class="role-actions">
          <button type="button" id="copy-url-button">
            <span class="button-text">Copy URL</span>
            <span class="success-text">
              <span class="checkmark"></span>
              Copied!
            </span>
          </button>
          <button type="button" id="clear-button">Clear</button>
          <label for="language-selector" style="display: none;">Language:</label>
          <select id="language-selector" style="display: none;">
            <option value="">Default</option>
          </select>
        </div>
      </div>
    </div>

    <hr>
    <div id="stats-container"></div>

    <div class="stats-controls-box">
      <div class="all-stats">
        <label for="level">
          Level
          <input type="text" id="level" name="level">
        </label>

        <label>
          <div id="xp_track"
               data-track
               data-track-name="Xp"
               data-track-max="5"
               data-track-shape="circle"></div>
        </label>

        <label for="hp">
          HP
          <input type="text" id="hp" name="hp">
        </label>

        <label for="armor">
          Armor
          <input type="text" id="armor" name="armor">
        </label>

        <button type="button" id="level1-help-button" class="help-icon" title="Show Level 1 stat guidance">?</button>
      </div>
    </div>
    <hr>
    
    <!-- UI Control -->
    <div class="ui-control">
      <div class="hide-options">
        <span class="hide-label">Hide:</span>
        <label>
          <input type="checkbox" id="hide_untaken" name="hide_untaken">
          untaken moves
        </label>
        <span class="separator">|</span>
        <label>
          <input type="checkbox" id="hide_help" name="hide_help">
          help
        </label>
      </div>
      <div class="collapse-controls">
        <button type="button" id="show-contents" class="burger-menu" title="Navigate" aria-label="Navigate">☰ Navigate</button>
        <button type="button" id="show-modules" class="burger-menu" title="Modules" aria-label="Show modules">🧩 Modules</button>
      </div>
    </div>

    <!-- Modules Modal -->
    <div id="modules-modal" class="modules-modal" style="display: none;">
      <div class="modules-content">
        <button type="button" class="modules-close" aria-label="Close">&times;</button>
        <h3>Modules</h3>
        <p class="modules-description">Enable optional content modules:</p>
        <div id="modules-list"></div>
        <div class="modules-buttons">
          <button type="button" id="modules-ok" class="modules-ok-btn">OK</button>
          <button type="button" id="modules-cancel" class="modules-cancel-btn">Cancel</button>
        </div>
      </div>
    </div>

    <div id="cards-container"></div>
    
    <div id="moves"></div>
  </form>

<!-- Core dependencies -->
<script src="events.js"></script>
<script src="utils.js"></script>
<script src="json-loader.js"></script>
<script src="data-loader.js"></script>
<script src="persistence.js"></script>
<script src="validation.js"></script>
<script src="stats.js"></script>
<script src="clock.js"></script>
<script src="text-formatter.js"></script>

<!-- Cards and moves modules -->
<script src="wizard.js"></script>
<script src="card-helpers.js"></script>
<script src="dynamic-table.js"></script>
<script src="cards.js"></script>
<script src="moves/moves-core.js"></script>
<script src="moves/inline-cards.js"></script>
<script src="moves/takefrom.js"></script>
<script src="moves/track.js"></script>
<script src="moves/moves.js"></script>

<!-- Layout system -->
<script src="layout.js"></script>

<!-- Main application -->
<script src="main.js"></script>

<!-- Language selector -->
<script src="language-selector.js"></script>

<!-- Modules UI -->
<script src="modules.js"></script>

<!-- Module attribution banner -->
<script src="module-attribution.js"></script>

<!-- Level 1 stat guidance help icon (role-specific, from availability.json) -->
<script src="level1-help.js"></script>

<!-- Narrow Path 1 / Path 2 down to the selected class's own paths (e.g. The
     Bard -> Dabbler, Diplomat, Swashbuckler), driven by the "paths" array on
     each class in data/availability.json. Kept self-contained here (rather
     than in the shared engine .js files) so upstream engine updates keep
     merging cleanly. Multiclass 1/2 deliberately keep their full data-roles
     list, since multiclassing pulls a path from a *different* class. If a
     class has no "paths" defined (or none is selected yet), Path 1/2 fall
     back to their own data-roles list, same as before this script existed. -->
<script>
(function() {
  'use strict';

  var CLASS_SELECT_ID = 'role';
  var PATH_SELECT_IDS = ['role2', 'role3'];

  function pathsForClass(className) {
    var roleData = className && window.availableMap && window.availableMap[className];
    return (roleData && Array.isArray(roleData.paths)) ? roleData.paths : null;
  }

  function fallbackRolesFor(select) {
    var attr = select.getAttribute('data-roles') || '';
    return attr.split(',').map(function(role) { return role.trim(); }).filter(Boolean);
  }

  // Rebuilds a select's <option> list from `roles`, keeping the current
  // selection if it's still offered. Returns true if the selection changed.
  function rebuildOptions(select, roles) {
    var previousValue = select.value;

    while (select.children.length > 1) {
      select.removeChild(select.lastChild);
    }

    roles.forEach(function(role) {
      var roleData = window.availableMap && window.availableMap[role];
      if (!roleData) return;
      var option = document.createElement('option');
      option.value = role;
      option.textContent = roleData.name || role;
      select.appendChild(option);
    });

    select.value = roles.indexOf(previousValue) !== -1 ? previousValue : '';
    return select.value !== previousValue;
  }

  function refreshPathSelectors(notifyOnChange) {
    var classSelect = document.getElementById(CLASS_SELECT_ID);
    var classPaths = classSelect ? pathsForClass(classSelect.value) : null;
    var changed = false;

    PATH_SELECT_IDS.forEach(function(id) {
      var select = document.getElementById(id);
      if (!select) return;
      var roles = (classPaths && classPaths.length) ? classPaths : fallbackRolesFor(select);
      if (rebuildOptions(select, roles)) changed = true;
    });

    if (changed && notifyOnChange) {
      var form = document.querySelector('form');
      if (form && window.Persistence) window.Persistence.saveToURL(form);
      if (window.Layout) window.Layout.layoutApplication();
    }
  }

  function wireUp() {
    var classSelect = document.getElementById(CLASS_SELECT_ID);
    if (classSelect) {
      // The class 'change' event itself still bubbles to persistence.js's
      // form-level listener after this runs, which re-renders once already.
      classSelect.addEventListener('change', function() {
        refreshPathSelectors(false);
      });
    }
    // Narrow Path 1/2 to whatever class the page loaded with (e.g. from a
    // shared URL). No event is bubbling here, so trigger the re-render ourselves.
    refreshPathSelectors(true);
  }

  if (window.AppEvents) {
    window.AppEvents.on('initializationComplete', wireUp);
  } else {
    document.addEventListener('DOMContentLoaded', wireUp);
  }
})();
</script>

</body>
</html>
